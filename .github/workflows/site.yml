name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0'   # every Sunday 18:00 UTC (11:00 PDT / 10:00 PST)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (weekly: publishes pieces dated up to the most recent Saturday, Pacific time)
        run: python3 _src/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
